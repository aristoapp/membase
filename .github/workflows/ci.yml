name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: pnpm install can run arbitrary postinstall scripts and this
# runs on fork PRs, so don't hand the default token org-wide write scope.
permissions:
  contents: read

jobs:
  check:
    name: pnpm check + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # claude:plugin-parity runs local `claude plugin validate`.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - run: pnpm install --frozen-lockfile

      # claude:bundle-provenance (inside pnpm check) rebuilds the plugin
      # bundles with bun and diffs them against the committed files.
      - uses: oven-sh/setup-bun@v2

      - run: pnpm lint

      - run: pnpm check

      # Runtime unit tests (copied in with the Group B runtimes). The parity
      # checks above are source-inspection only; these actually import and
      # exercise the runtimes.
      - name: Install Hermes runtime deps
        run: python3 -m pip install httpx pyyaml

      - run: pnpm hermes:test

      - run: pnpm openclaw:runtime-test

      - run: pnpm claude:runtime-test

      - run: pnpm contract:test

      - run: pnpm cursor:runtime-test

      - run: pnpm capture-core:test

      - run: pnpm smoke:execute

  e2e-tier1:
    # Hits the live mcp.membase.so endpoint (no credentials). Kept as a
    # separate job so a Membase outage is visible without masquerading as a
    # build failure.
    name: e2e tier 1 (live endpoint, no creds)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node e2e/run-e2e.mjs

  e2e-tier2-staging:
    # Fast live smoke (authed remember/search) against STAGING on every push/PR.
    # Uses a staging-only client_credentials service token (no browser). Skips
    # gracefully when the secret is unavailable (e.g. forked PRs) so it never
    # blocks external contributions. Deep quality/latency (Tier 3) stays nightly.
    name: e2e tier 2 (staging, authed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MEMBASE_AUTH_BASE: ${{ vars.MEMBASE_STAGING_AUTH_BASE }}
      MEMBASE_MCP_URL: ${{ vars.MEMBASE_STAGING_MCP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Tier 2 (fast smoke) against staging
        env:
          MEMBASE_SERVICE_CLIENT_ID: ${{ secrets.MEMBASE_STAGING_SERVICE_CLIENT_ID }}
          MEMBASE_SERVICE_CLIENT_SECRET: ${{ secrets.MEMBASE_STAGING_SERVICE_CLIENT_SECRET }}
        run: |
          if [ -z "$MEMBASE_SERVICE_CLIENT_ID" ]; then
            echo "::notice::No staging service credentials (likely a fork PR) — skipping Tier 2."
            exit 0
          fi
          node e2e/run-e2e.mjs --live

  e2e-tier3-staging:
    # Deep quality/latency + filter/negative-case eval against STAGING.
    # Minutes-long, so it does NOT run on every push/PR. It runs when either:
    #   - triggered manually (workflow_dispatch), OR
    #   - the PR is from a trusted author (OWNER/MEMBER/COLLABORATOR) on a
    #     SAME-REPO branch (not a fork). Fork PRs never get secrets from a
    #     pull_request event, so the staging service token would be empty
    #     there anyway; those fall through to a skip and can be run via the
    #     button. External contributors' PRs (CONTRIBUTOR/NONE) also skip.
    # Nightly deep coverage still lives in e2e-staging.yml's schedule.
    name: e2e tier 3 (staging, deep — trusted PR + manual)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    # Healthy Tier 3 is ~7 min; one exhausted 180s recall poll pushes past 10.
    # 15 keeps the run alive long enough to finish + print its report (and run
    # the leftover sweep) while the staging backlog drains, instead of dying
    # with zero diagnostics.
    timeout-minutes: 15
    env:
      MEMBASE_AUTH_BASE: ${{ vars.MEMBASE_STAGING_AUTH_BASE }}
      MEMBASE_MCP_URL: ${{ vars.MEMBASE_STAGING_MCP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Tier 3 (deep quality/latency + filters + negative cases) against staging
        env:
          MEMBASE_SERVICE_CLIENT_ID: ${{ secrets.MEMBASE_STAGING_SERVICE_CLIENT_ID }}
          MEMBASE_SERVICE_CLIENT_SECRET: ${{ secrets.MEMBASE_STAGING_SERVICE_CLIENT_SECRET }}
        run: |
          if [ -z "$MEMBASE_SERVICE_CLIENT_ID" ]; then
            echo "::error::MEMBASE_STAGING_SERVICE_CLIENT_ID is not set — cannot run Tier 3."
            exit 1
          fi
          node e2e/run-e2e.mjs --tier3
