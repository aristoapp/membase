name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: pnpm check + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # claude:plugin-parity runs local `claude plugin validate`.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm smoke:execute

  e2e-tier1:
    # Hits the live mcp.membase.so endpoint (no credentials). Kept as a
    # separate job so a Membase outage is visible without masquerading as a
    # build failure.
    name: e2e tier 1 (live endpoint, no creds)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node e2e/run-e2e.mjs
