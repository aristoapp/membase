name: Publish

# Per-client release tags — versions follow each package's published lineage
# (npm @membase/openclaw-membase, PyPI hermes-membase), not the monorepo
# version. Claude/Codex/Cursor need no publish job: their channel is this
# git repo itself (marketplace / plugins-cli git-direct).
on:
  push:
    tags:
      - "openclaw-v*"
      - "hermes-v*"
  # Manual redeploy (e.g. retrying a publish that failed midway, or
  # republishing the current version without cutting a new tag). Pick the
  # target and, for tag-triggered semantics, the tag to run against via the
  # workflow_dispatch ref selector in the Actions UI.
  workflow_dispatch:
    inputs:
      target:
        description: Package to publish
        required: true
        type: choice
        options:
          - openclaw
          - hermes

permissions:
  contents: read

jobs:
  publish-openclaw:
    if: startsWith(github.ref_name, 'openclaw-v') || inputs.target == 'openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: startsWith(github.ref_name, 'openclaw-v')
        working-directory: clients/openclaw/runtime
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#openclaw-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Note manual publish version
        if: github.event_name == 'workflow_dispatch'
        working-directory: clients/openclaw/runtime
        run: echo "Manual dispatch — publishing current package.json version $(node -p "require('./package.json').version") (no tag check)."

      # The runtime ships TS sources and depends on @membase/capture-core
      # (workspace:* → exact version at pack time), so the dependency must
      # exist on npm first. The guard refuses to silently skip a version whose
      # source changed without a bump (which would ship a stale sanitizer):
      #   exit 10 = not published → publish; 0 = unchanged → skip; 1 = drifted → fail.
      - name: Publish @membase/capture-core dependency
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/check-capture-core-publish.mjs packages/capture-core && rc=0 || rc=$?
          if [ "$rc" = "10" ]; then
            pnpm --filter @membase/capture-core publish --access public --no-git-checks
          elif [ "$rc" = "0" ]; then
            echo "capture-core already published and unchanged — skipping"
          else
            exit "$rc"
          fi

      - name: Publish to npm
        working-directory: clients/openclaw/runtime
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks

  publish-hermes:
    if: startsWith(github.ref_name, 'hermes-v') || inputs.target == 'hermes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify tag matches package version
        if: startsWith(github.ref_name, 'hermes-v')
        working-directory: clients/hermes/python
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#hermes-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Note manual publish version
        if: github.event_name == 'workflow_dispatch'
        working-directory: clients/hermes/python
        run: echo "Manual dispatch — publishing current pyproject.toml version $(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])") (no tag check)."

      - name: Build package
        working-directory: clients/hermes/python
        run: python -m build

      - name: Publish to PyPI
        working-directory: clients/hermes/python
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "PYPI_API_TOKEN is not set." >&2
            exit 1
          fi
          # --skip-existing keeps tag re-pushes / retries idempotent, matching
          # the npm job's npm-view guard.
          twine upload --skip-existing -u __token__ -p "${PYPI_API_TOKEN}" dist/*
