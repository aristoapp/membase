name: E2E live (quality + latency)

on:
  schedule:
    - cron: "17 1 * * *" # daily 01:17 UTC
  workflow_dispatch:

jobs:
  e2e-live:
    name: remember/search/context lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Auth (preferred): MEMBASE_SERVICE_CLIENT_ID/SECRET — static
      # client_credentials service credentials (aristoapp/membase#318),
      # provisioned via apps/api/scripts/create_service_client.py. No
      # rotation, no PAT needed; revoke by deleting the service client.
      #
      # Fallback: MEMBASE_MCP_REFRESH_TOKEN/MEMBASE_MCP_CLIENT_ID refresh
      # chain. The server rotates refresh tokens, so the rotated token must
      # be written back (requires GH_SECRETS_PAT); remove this path once the
      # service credentials are live.
      - name: Run Tier 2 live eval (Tier 1 fallback without credentials)
        id: live
        env:
          MEMBASE_SERVICE_CLIENT_ID: ${{ secrets.MEMBASE_SERVICE_CLIENT_ID }}
          MEMBASE_SERVICE_CLIENT_SECRET: ${{ secrets.MEMBASE_SERVICE_CLIENT_SECRET }}
          MEMBASE_MCP_REFRESH_TOKEN: ${{ secrets.MEMBASE_MCP_REFRESH_TOKEN }}
          MEMBASE_MCP_CLIENT_ID: ${{ secrets.MEMBASE_MCP_CLIENT_ID }}
        run: |
          if [ -z "$MEMBASE_SERVICE_CLIENT_ID" ] && [ -z "$MEMBASE_MCP_REFRESH_TOKEN" ]; then
            echo "::notice::No live credentials configured — running Tier 1 only."
            node e2e/run-e2e.mjs
          else
            # Nightly prod run: Tier 3 (deep quality/latency), since --live is
            # now the fast smoke tier.
            node e2e/run-e2e.mjs --tier3
          fi

      - name: Persist rotated refresh token to repo secret (fallback path only)
        if: always() && steps.live.outputs.rotated_refresh_token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          ROTATED: ${{ steps.live.outputs.rotated_refresh_token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Refresh token was rotated but GH_SECRETS_PAT is not set — the stored MEMBASE_MCP_REFRESH_TOKEN is now stale. Re-seed with e2e/get-token.mjs before the next run."
            exit 0
          fi
          printf '%s' "$ROTATED" | gh secret set MEMBASE_MCP_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "rotated refresh token stored."
