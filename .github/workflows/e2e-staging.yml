name: E2E staging (client_credentials)

# Verifies the connector contract + remember/search/context lifecycle against
# the Membase backend's STAGING environment (the backend's pre-prod gate; its
# deploys land on staging before prod). Auth uses a staging-only
# client_credentials service client, so no human login and no token rotation
# is needed.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Which tier to run"
        type: choice
        default: "2"
        options: ["2", "3"]
  schedule:
    - cron: "47 1 * * *" # daily 01:47 UTC (after the nightly staging deploy)

concurrency:
  group: e2e-staging
  cancel-in-progress: false

# Least privilege: this job only reads the repo and calls Membase over HTTP.
permissions:
  contents: read

jobs:
  e2e-staging:
    name: staging remember/search/context lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Staging Cloud Run endpoints (stable per project; not secrets).
      MEMBASE_AUTH_BASE: ${{ vars.MEMBASE_STAGING_AUTH_BASE }}
      MEMBASE_MCP_URL: ${{ vars.MEMBASE_STAGING_MCP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Staging service credentials — a client_credentials client bound to a
      # dedicated ci-e2e test user, provisioned by a Membase backend admin.
      # Revoke by deleting that service client; no rotation, no PAT.
      # workflow_dispatch → Tier 2 (fast smoke, ~seconds). schedule (nightly)
      # → Tier 3 (deep quality/latency, minutes). Same harness, same creds.
      - name: Run staging e2e (Tier 2 on demand, Tier 3 nightly)
        env:
          MEMBASE_SERVICE_CLIENT_ID: ${{ secrets.MEMBASE_STAGING_SERVICE_CLIENT_ID }}
          MEMBASE_SERVICE_CLIENT_SECRET: ${{ secrets.MEMBASE_STAGING_SERVICE_CLIENT_SECRET }}
        run: |
          if [ -z "$MEMBASE_SERVICE_CLIENT_ID" ]; then
            echo "::error::MEMBASE_STAGING_SERVICE_CLIENT_ID is not set — cannot run the staging live eval."
            exit 1
          fi
          # Nightly always runs Tier 3; manual runs honor the `tier` input
          # (default 2 = fast smoke, 3 = deep quality/latency).
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.tier }}" = "3" ]; then
            echo "::notice::Running Tier 3 (deep quality/latency)."
            node e2e/run-e2e.mjs --tier3
          else
            echo "::notice::Running Tier 2 (fast smoke)."
            node e2e/run-e2e.mjs --live
          fi
