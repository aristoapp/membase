packages:
  - "packages/*"
  - "clients/*"
  - "clients/openclaw/runtime"
  - "smoke/*"
# Dependencies of the openclaw peer dep pulled in for runtime typechecking;
# none of their postinstall scripts are needed for type-only usage.
allowBuilds:
  '@google/genai': false
  openclaw: false
  protobufjs: false
  tree-sitter-bash: false
